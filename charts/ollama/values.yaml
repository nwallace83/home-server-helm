ollama:
  replicaCount: 0
  ollama:
    gpu:
      enabled: true
    models:
      create:
      - name: "qwen3.6:27b"
        template: |
          FROM qwen3.6:27b
          PARAMETER num_ctx 256144
      - name: "qwen3-coder:30b-a3b-q4_K_M"
        template: |
          FROM qwen3-coder:30b-a3b-q4_K_M
          PARAMETER num_ctx 256144
      - name: "qwen3:8b"
        template: |
          FROM qwen3:8b
          PARAMETER num_ctx 13560
      - name: "qwen3:8b-128k"
        template: |
          FROM qwen3:8b
          PARAMETER num_ctx 131072
      - name: "qwen2.5-coder:7b"
        template: |
          FROM qwen2.5-coder:7b
          PARAMETER num_ctx 131072
      run:
      - "qwen3-coder:30b-a3b-q4_K_M"
      - "qwen3:8b-128k"
      - "qwen3.6:27b"
      - "qwen3:8b"
      - "qwen2.5-coder:7b"
  httpRoute:
    enabled: true
    parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: gateway-internal
      namespace: kube-system
    hostnames:
    - ollama.nwallace.io
  nodeSelector:
    kubernetes.io/hostname: arch-desktop
  persistentVolume:
    enabled: true
    existingClaim: ollama-data
  image:
    repository: harbor.nwallace.io/docker-hub/ollama/ollama
  extraEnv:
  - name: OLLAMA_MAX_LOADED_MODELS
    value: '1'
  readinessProbe:
    enabled: true
    path: /
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 24
    successThreshold: 1

open-webui:
  enableOpenaiApi: false
  ollama:
    enabled: false
  ollamaUrls:
  - https://ollama.nwallace.io
  route:
    enabled: true
    parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: gateway-internal
      namespace: kube-system
    hostnames:
    - webui.nwallace.io
