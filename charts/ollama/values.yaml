ollama:
  replicaCount: 1
  ollama:
    gpu:
      enabled: true
    models:
      create:
        - name: "qwen3:8b"
          template: |
            FROM qwen3:8b
            PARAMETER num_ctx 13560
        - name: "qwen2.5-coder:7b"
          template: |
            FROM qwen2.5-coder:7b
            PARAMETER num_ctx 8192
      run:
        - "qwen3:8b"
        - "qwen2.5-coder:7b"
  httpRoute:
    enabled: true
    parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: gateway-internal
      namespace: kube-system
    hostnames:
    - ollama.nwallace.io
  nodeSelector:
    kubernetes.io/hostname: arch-desktop
  persistentVolume:
    enabled: true
    existingClaim: ollama-data
  image:
    repository: harbor.nwallace.io/docker-hub/ollama/ollama
  extraEnv:
    - name: OLLAMA_MAX_LOADED_MODELS
      value: '1'

open-webui:
  enableOpenaiApi: false
  ollama:
    enabled: false
  ollamaUrls:
    - https://ollama.nwallace.io
  route:
    enabled: true
    parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: gateway-internal
      namespace: kube-system 
    hostnames:
    - webui.nwallace.io
searxng:
  ingress:
    enabled: false
  gateway:
    enabled: true
    parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: gateway-internal
      namespace: kube-system 
    hostnames:
      - searxng.nwallace.io
  config:
    settings:
      server:
        base_url: https://searxng.nwallace.io/
      search:
        safe_search: 0
        autocomplete: ""
        # ⚠️ CRITICAL STEP: Add 'json' to the list of allowed response formats
        formats:
          - html
          - json