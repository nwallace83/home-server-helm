timezone: America/Denver
image: harbor.nwallace.io/home-server/strata:local
commonLabels:
  backstage.io/kubernetes-id: strata
vaultSecretPath: strata
resources:
  requests:
    nvidia.com/gpu: '1'
  limits:
    nvidia.com/gpu: '1'
httpRoute:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: gateway-internal
    namespace: kube-system
  hostnames:
  - strata.nwallace.io
pvc:
  storageClassName: strata-data
  size: 90Gi
imagePullPolicy: Always
livenessProbe: 
  httpGet:
    path: /api/health
    port: 8080
    scheme: HTTP
  initialDelaySeconds: 10
  timeoutSeconds: 5
  periodSeconds: 10
  successThreshold: 1
  failureThreshold: 12
readinessProbe:
  httpGet:
    path: /api/health
    port: 8080
    scheme: HTTP
  initialDelaySeconds: 10
  timeoutSeconds: 5
  periodSeconds: 10
  successThreshold: 1
  failureThreshold: 12

searxng:
  ingress:
    enabled: false
  gateway:
    enabled: true
    parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: gateway-internal
      namespace: kube-system
    hostnames:
    - searxng.nwallace.io
  secret:
    existingSecret: searxng-secret
  config:
    settings:
      server:
        base_url: https://searxng.nwallace.io/
      search:
        safe_search: 0
        autocomplete: ""
        formats:
        - html
        - json

open-webui:
  fullnameOverride: open-webui
  enableOpenaiApi: true
  openaiBaseApiUrl: https://strata.nwallace.io
  openaiApiKeyExistingSecret: strata-env
  openaiApiKeyExistingSecretKey: API_KEY
  ollama:
    enabled: false
  route:
    enabled: true
    parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: gateway-internal
      namespace: kube-system
    hostnames:
    - webui.nwallace.io
  persistence:
    s3:
      bucket: web-ui
      endpointUrl: https://minio.nwallace.io
      region: us-east-1
      accessKeyExistingSecret: strata-env
      accessKeyExistingAccessKey: S3_ACCESS_KEY
      secretKeyExistingSecret: strata-env
      secretKeyExistingSecretKey: S3_SECRET_KEY
  terminals:
    enabled: true
  pipelines:
    enabled: true
    extraEnvVars:
      - name: PIPELINES_URLS
        value: "https://github.com/open-webui/pipelines/blob/main/examples/filters/detoxify_filter_pipeline.py"
      - name: PIPELINES_API_KEY
        valueFrom:
          secretKeyRef:
            name: strata-env
            key: PIPELINES_API_KEY
    fullnameOverride: web-ui-pipelines
  image:
    repository: harbor.nwallace.io/github/open-webui/open-webui