timezone: America/Denver
image: harbor.nwallace.io/home-server/strata:local
commonLabels:
  backstage.io/kubernetes-id: strata
resources:
  requests:
    nvidia.com/gpu: '1'
  limits:
    nvidia.com/gpu: '1'
httpRoute:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: gateway-internal
    namespace: kube-system
  hostnames:
  - strata.nwallace.io
pvc:
  storageClassName: strata-data
  size: 90Gi
imagePullPolicy: Always
livenessProbe: 
  httpGet:
    path: /api/health
    port: 8080
    scheme: HTTP
  initialDelaySeconds: 10
  timeoutSeconds: 5
  periodSeconds: 10
  successThreshold: 1
  failureThreshold: 12
readinessProbe:
  httpGet:
    path: /api/health
    port: 8080
    scheme: HTTP
  initialDelaySeconds: 10
  timeoutSeconds: 5
  periodSeconds: 10
  successThreshold: 1
  failureThreshold: 12
