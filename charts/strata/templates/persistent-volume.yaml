apiVersion: v1
kind: PersistentVolume
metadata:
  name: data-strata-0
spec:
  capacity:
    storage: 90Gi
  hostPath:
    path: /var/lib/longhorn/strata
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: strata-data
  volumeMode: Filesystem
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - arch-desktop
