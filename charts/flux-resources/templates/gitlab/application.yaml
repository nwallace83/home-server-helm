apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitlab
  namespace: argo-cd
spec:
  destination:
    namespace: gitlab
    server: https://kubernetes.default.svc
  project: home-server
  source:
    path: charts/gitlab
    repoURL: https://gitlab.nwallace.io/home-server/home-server-helm.git
    targetRevision: HEAD
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      # enabled: true
    syncOptions:
      - RespectIgnoreDifferences=true
      - ServerSideApply=true
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      name: gitlab-gitaly
      jsonPointers:
        - /spec/volumeClaimTemplates/0/apiVersion
        - /spec/volumeClaimTemplates/0/kind
    - group: apps
      kind: StatefulSet
      name: gitlab-redis-master
      jsonPointers:
        - /spec/volumeClaimTemplates/0/apiVersion
        - /spec/volumeClaimTemplates/0/kind
    - group: batch
      kind: Job
      jsonPointers:
        - /metadata/labels/argocd.argoproj.io~1instance
    - group: postgresql.cnpg.io
      kind: Cluster
      name: gitlab
      jsonPointers:
        - /spec/plugins/0/enabled
        - /spec/plugins/0/isWALArchiver
        - /spec/externalClusters/0/plugin/enabled
        - /spec/externalClusters/0/plugin/isWALArchiver
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      jsonPointers:
        - /spec/rules/0/backendRefs/0/group
        - /spec/rules/0/backendRefs/0/kind
        - /spec/rules/0/backendRefs/0/weight
    - group: gateway.networking.k8s.io
      kind: TCPRoute
      name: gitlab-gitlab-shell
      jsonPointers:
        - /spec/rules/0/backendRefs/0/group
        - /spec/rules/0/backendRefs/0/kind
        - /spec/rules/0/backendRefs/0/weight
    - group: postgresql.cnpg.io
      kind: Cluster
      name: gitlab-db
      jsonPointers:
        - /spec/plugins/0/enabled
        - /spec/externalClusters/0/plugin